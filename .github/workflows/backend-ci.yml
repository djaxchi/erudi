name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-ci:
    name: backend-ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # All three legs are merge gates. Windows and macOS were advisory
    # (continue-on-error) while their failures were triaged; that work is done
    # -- the last ten were fixed in #358 and all three legs have been green on
    # main since. Promoted per the criteria in docs/dev/backend-ci-multi-os.md.
    strategy:
      # Never cancel the other legs when one fails: a failure on one platform
      # should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x64 CPU
            reqs: linux-cpu.txt
            venv_bin: bin
            fail_fast: '-x'
          - os: windows-latest # x64 CPU
            reqs: win-cpu.txt
            venv_bin: Scripts
            fail_fast: '-x'
          - os: macos-14 # Apple Silicon
            reqs: mac-silicon.txt
            venv_bin: bin
            fail_fast: '-x'
    env:
      PYTHONUNBUFFERED: 1
    defaults:
      run:
        shell: bash # git-bash on Windows: consistent forward-slash paths
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # setup-python already scopes its pip cache key by runner OS and
          # architecture, so the three legs cannot collide on one key.
          cache: 'pip'
          cache-dependency-path: backend/requirements/**

      - name: Install pip, wheel, setuptools
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Create venv & install requirements
        run: |
          python -m venv backend/venv
          backend/venv/${{ matrix.venv_bin }}/python -m pip install -r backend/requirements/entrypoints/dev/${{ matrix.reqs }}

      - name: Syntax check
        run: backend/venv/${{ matrix.venv_bin }}/python -m compileall backend/src -q

      - name: Lint (ruff)
        run: backend/venv/${{ matrix.venv_bin }}/python -m ruff check backend/src

      - name: Import check
        run: |
          cd backend
          venv/${{ matrix.venv_bin }}/python -c "from src.main import app; print('OK')"

      # `-m "not mlx_only"` is kept on EVERY leg on purpose, macos-14 included.
      # macos-14 is the first runner where the mlx_only tests could actually
      # execute, and they pull a ~280 MB fixture model (mlx_test_model_path in
      # tests/conftest.py). This workflow is here to get signal on the shared
      # suite; adding a model download to CI is a separate decision. Deliberate
      # exclusion, not an oversight.
      - name: Tests
        run: |
          cd backend
          venv/${{ matrix.venv_bin }}/python -m pytest tests/ ${{ matrix.fail_fast }} -q --ignore=tests/e2e -m "not mlx_only"
