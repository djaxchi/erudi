# Ruff is the only tool these hooks run: it lints and it formats, and one tool
# cannot disagree with itself. The pin matches the `ruff` pin in
# `backend/requirements/meta/dev.txt`, so the hooks, the dev environment and CI
# all run the same version. Move the two together.
#
# Formatting width comes from the ruff.toml nearest each file -- `backend/ruff.toml`
# for the backend, the root `ruff.toml` for everything else, both `line-length = 100`.
# No CLI flag here, so nothing can drift out of sync with the config CI reads.
#
# There is deliberately no test hook. The backend suite boots a real embedded
# PostgreSQL cluster and takes tens of seconds, which is not something a commit
# should do. Run it yourself before you push:
#
#   cd backend && pytest tests/ -q --ignore=tests/e2e -m "not mlx_only"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff lint
        args: ['--fix']
      - id: ruff-format
        name: ruff format
